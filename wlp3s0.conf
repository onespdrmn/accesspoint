
#
interface=wlp3s0
#interface=wlx1cbfce1fb5fe
interface=wlx1cbfcef20a59
except-interface=lo
except-interface=eno1
no-dhcp-interface=lo
no-dhcp-interface=eno1
bind-interfaces

#listen-address=192.168.1.1
listen-address=192.168.2.1
listen-address=192.168.3.1

server=1.1.1.1   #dns

#log-queries
log-dhcp

no-dhcp-interface=lo
no-dhcp-interface=eno1

dhcp-range=interface:wlx1cbfce1fb5fe,192.168.1.50,192.168.1.100,255.255.255.0,8h
dhcp-option=interface:wlx1cbfce1fb5fe,3,192.168.1.1
dhcp-option=interface:wlx1cbfce1fb5fe,6,192.168.1.1

dhcp-range=interface:wlp3s0,192.168.2.50,192.168.2.100,255.255.255.0,8h
dhcp-option=interface:wlp3s0,3,192.168.2.1
dhcp-option=interface:wlp3s0,6,192.168.2.1

dhcp-range=interface:wlx1cbfcef20a59,192.168.3.50,192.168.3.100,255.255.255.0,8h
dhcp-option=interface:wlx1cbfcef20a59,3,192.168.3.1
dhcp-option=interface:wlx1cbfcef20a59,6,192.168.3.1

#######################################################
cache-size=1000
domain-needed
bogus-priv
dns-forward-max=150
resolv-file=/etc/resolv.conf
#no-poll
#log-queries
conf-file=/etc/dnsmasq.blacklist.txt

